# Автономный запуск ТОЛЬКО бота (без Mini App/Caddy/HTTPS) — для локального
# теста и разработки. Полный прод-стек (бот + Mini App + Caddy/HTTPS) собирается
# из соседних репозиториев NRW-Bot + NRW-MiniApp через отдельный deploy/
# docker-compose.yml (см. README.md, "Полный прод-стек").
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nrwbot}
      POSTGRES_USER: ${POSTGRES_USER:-nrwbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nrwbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nrwbot}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # --appendonly yes — FSM-состояние (шаги диалогов) переживает рестарт
    # контейнера, а не только процесса бота внутри него.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # MTProto-прокси для самого Telegram (FakeTLS, см. диалог 2026-08-22) — НЕ VPN
  # на весь трафик, только разгоняет сам мессенджер. Профиль 'proxy' — сервис НЕ
  # стартует по умолчанию (`docker compose up`), только явно:
  #   docker compose --profile proxy up -d
  # Секрет генерируется один раз командой:
  #   docker run --rm nineseconds/mtg:2 generate-secret tls -c www.google.com
  # и кладётся в .env как PROXY_SECRET — тот же секрет должен знать и бот
  # (для ссылки t.me/proxy?...), и сам mtg (чтобы шифровать/расшифровывать).
  mtg:
    image: nineseconds/mtg:2
    restart: unless-stopped
    profiles: ['proxy']
    # :- а не :? — интерполяция переменных в compose считается для ВСЕХ
    # сервисов при любом запуске, даже без --profile proxy; :? уронил бы
    # обычный `docker compose up` бота, если PROXY_SECRET ещё не задан.
    command: ['run', '${PROXY_SECRET:-unset}']
    ports:
      # 443 совместно с реверс-прокси на этом порту не уживётся — если 443 уже
      # занят Caddy/nginx, выберите другой PROXY_PORT (например 8443) и укажите
      # его же в .env бота, он ходит в ссылку, а не в сам контейнер.
      - '${PROXY_PORT:-443}:3128'

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Cabinet API (/cabinet/*, включая /cabinet/webhooks/*) — только на
      # loopback, наружу торчит через реверс-прокси на сервере (см. диалог,
      # 2026-08-20 — что именно там стоит, nginx или Caddy, ещё уточняется,
      # см. деплой-репозиторий) сразу под двумя доменами на один и тот же
      # порт — cabinet.nocto.online (MiniApp) и admin.nocto.online (вебхуки,
      # см. app/cabinet/webhooks.py).
      - "127.0.0.1:8080:8080"
    environment:
      # Переопределяет DATABASE_URL/REDIS_URL из .env (там по умолчанию SQLite
      # и пусто) — здесь бот всегда ходит в postgres/redis-контейнеры выше.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nrwbot}:${POSTGRES_PASSWORD:-nrwbot}@postgres:5432/${POSTGRES_DB:-nrwbot}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
