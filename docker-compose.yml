# Автономный запуск ТОЛЬКО бота (без Mini App/Caddy/HTTPS) — для локального
# теста и разработки. Полный прод-стек (бот + Mini App + Caddy/HTTPS) собирается
# из соседних репозиториев NRW-Bot + NRW-MiniApp через отдельный deploy/
# docker-compose.yml (см. README.md, "Полный прод-стек").
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nrwbot}
      POSTGRES_USER: ${POSTGRES_USER:-nrwbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nrwbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nrwbot}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # --appendonly yes — FSM-состояние (шаги диалогов) переживает рестарт
    # контейнера, а не только процесса бота внутри него.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Cabinet API (/cabinet/*, включая /cabinet/webhooks/*) — только на
      # loopback, наружу торчит через реверс-прокси на сервере (см. диалог,
      # 2026-08-20 — что именно там стоит, nginx или Caddy, ещё уточняется,
      # см. деплой-репозиторий) сразу под двумя доменами на один и тот же
      # порт — cabinet.nocto.online (MiniApp) и admin.nocto.online (вебхуки,
      # см. app/cabinet/webhooks.py).
      - "127.0.0.1:8080:8080"
    environment:
      # Переопределяет DATABASE_URL/REDIS_URL из .env (там по умолчанию SQLite
      # и пусто) — здесь бот всегда ходит в postgres/redis-контейнеры выше.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nrwbot}:${POSTGRES_PASSWORD:-nrwbot}@postgres:5432/${POSTGRES_DB:-nrwbot}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
