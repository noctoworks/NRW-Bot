# Автономный запуск ТОЛЬКО бота (без Mini App/Caddy/HTTPS) — для локального
# теста и разработки. Полный прод-стек (бот + Mini App + Caddy/HTTPS) собирается
# из соседних репозиториев NRW-Bot + NRW-MiniApp через отдельный deploy/
# docker-compose.yml (см. README.md, "Полный прод-стек").
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nrwbot}
      POSTGRES_USER: ${POSTGRES_USER:-nrwbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nrwbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nrwbot}']
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Переопределяет DATABASE_URL из .env (там по умолчанию SQLite) — здесь
      # бот всегда ходит в postgres-контейнер выше.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nrwbot}:${POSTGRES_PASSWORD:-nrwbot}@postgres:5432/${POSTGRES_DB:-nrwbot}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - remnawave-network

volumes:
  postgres_data:

networks:
  default: {}
  # Сеть панели Remnawave — создана ЕЁ собственным docker-compose (не нашим),
  # поэтому external: true. Когда панель и бот на одном VPS (см. диалог: "панель
  # и VPS живут на одном VPS"), REMNAWAVE_BASE_URL в .env указывает на имя
  # контейнера в этой сети (http://remnawave:3000), а не на публичный домен —
  # так запрос идёт напрямую по внутренней docker-сети, в обход Cloudflare
  # (у которого periodически бывает 520 на этот домен).
  remnawave-network:
    external: true
